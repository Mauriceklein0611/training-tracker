<!doctype html>
<html lang="de" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + env(safe-area-inset-*) in CSS handles the iPhone notch/home indicator -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <meta
      name="description"
      content="Exerivo ist ein kostenloser Trainingstracker für Kraft und Cardio. Alle Daten bleiben auf diesem Gerät."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="color-scheme" content="dark light" />

    <!-- iOS standalone behaviour -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Exerivo" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />

    <title>Exerivo</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Exerivo benötigt JavaScript. Bitte aktiviere JavaScript in deinem Browser.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
